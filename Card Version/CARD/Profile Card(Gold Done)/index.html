<body>

    <div class="profile-image">

    </div>
    <div class="card-content">


      <div class="subtitle">
        <h3>Hossam Galal</h3>
        @hussamgalal999
      </div>
      <code class="code">I'm a<br> Software Developer<br>Security Engineer.</code>
      <code class="code">I'm from Egypt, living in Minya and currently working at IBM. You can find me on GitHub , or Twitter & this page you can
        find
        some information about me and a few blog posts</code>
    </div>
    <div class="icons">
      <a href="#" class="fab fa-facebook-f"></a>
      <a href="#" class="fab fa-youtube"></a>
      <a href="#" class="fab fa-instagram"></a>
      <a href="#" class="fab fa-twitter"></a>
      <a href="#" class="fab fa-whatsapp"></a>
    </div>
  </div>
  <!--Profile card end-->

</body>

</html>
